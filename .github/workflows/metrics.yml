name: Metrics

on:
  schedule: # execute once a day at 00:30 UTC (09:30 JST)
    - cron: "30 0 * * *"
  workflow_dispatch:

jobs:
  metrics:
    runs-on: ubuntu-latest
    name: generate-metrics-svg
    permissions:
      contents: write

    steps:
      # Contribution calendar (isometric) — includes the current commit streak
      - name: Contribution calendar
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.SUMMARY_CARDS_TOKEN }}
          filename: assets/metrics-calendar.svg
          base: ""
          config_timezone: Asia/Tokyo
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # Language breakdown
      - name: Languages
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.SUMMARY_CARDS_TOKEN }}
          filename: assets/metrics-languages.svg
          base: ""
          config_timezone: Asia/Tokyo
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: bytes-size, percentage

      # Coding habits — commit time distribution and recently used languages
      - name: Habits
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.SUMMARY_CARDS_TOKEN }}
          filename: assets/metrics-habits.svg
          base: ""
          config_timezone: Asia/Tokyo
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_charts: yes
