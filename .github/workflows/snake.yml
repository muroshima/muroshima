name: Generate Snake

on:
  schedule: # execute once a day at 01:00 UTC (10:00 JST)
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  snake:
    runs-on: ubuntu-latest
    name: generate-contribution-snake
    permissions:
      contents: write

    steps:
      # github_token defaults to the action token, so no PAT is required here
      - name: Generate snake animation
        uses: Platane/snk@v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light
            dist/github-snake-dark.svg?palette=github-dark

      # Published to the `output` branch so the daily regeneration does not
      # add commits to main's history
      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
