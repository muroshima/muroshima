<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Yuto Muroshima — Data Engineer">
  <title>Yuto Muroshima — Data Engineer</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1628"/>
      <stop offset="42%" stop-color="#16487A"/>
      <stop offset="78%" stop-color="#1D82C4"/>
      <stop offset="100%" stop-color="#29B5E8"/>
    </linearGradient>

    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#29B5E8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7FD8F7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#29B5E8" stop-opacity="0"/>
    </linearGradient>

    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#FFFFFF" fill-opacity="0.10"/>
    </pattern>

    <radialGradient id="halo" cx="0.82" cy="0.18" r="0.62">
      <stop offset="0%" stop-color="#8FE3FF" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#8FE3FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#dots)"/>
  <rect width="1200" height="280" fill="url(#halo)"/>

  <!-- flowing data-pipeline waves -->
  <g fill="none" stroke-linecap="round">
    <path d="M-40 214 C 180 160, 330 258, 560 206 S 940 132, 1240 190"
          stroke="#FFFFFF" stroke-opacity="0.13" stroke-width="2.5"/>
    <path d="M-40 244 C 200 196, 360 286, 600 236 S 960 172, 1240 224"
          stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="2"/>
    <path d="M-40 184 C 220 128, 400 226, 640 172 S 980 100, 1240 156"
          stroke="#7FD8F7" stroke-opacity="0.16" stroke-width="1.6"/>
  </g>

  <!-- pipeline nodes -->
  <g fill="#8FE3FF" fill-opacity="0.85">
    <circle cx="560" cy="206" r="4.5"/>
    <circle cx="878" cy="158" r="3.5"/>
    <circle cx="236" cy="176" r="3"/>
  </g>

  <text x="72" y="126"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="58" font-weight="700" fill="#FFFFFF" letter-spacing="1.5">Yuto Muroshima</text>

  <rect x="74" y="150" width="118" height="3" rx="1.5" fill="url(#glow)"/>

  <text x="74" y="190"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="24" font-weight="500" fill="#CFEEFC" letter-spacing="3.4">DATA ENGINEER</text>

  <text x="74" y="228"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="16" font-weight="400" fill="#9FD4EE" letter-spacing="0.6">Snowflake · dbt · Google Cloud · BigQuery · Tokyo, Japan</text>
</svg>
