<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 340" width="440" height="340" role="img" aria-label="An animated gorilla idling, drumming its chest and jumping">
  <title>Gorilla</title>
  <desc>Hand-authored animated SVG. Loops through idle breathing, blinking, chest drumming and a jump.</desc>

  <defs>
    <linearGradient id="furGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A4245"/>
      <stop offset="100%" stop-color="#332C2F"/>
    </linearGradient>
    <linearGradient id="armGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#75696E"/>
      <stop offset="100%" stop-color="#544A4E"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8E7B75"/>
      <stop offset="100%" stop-color="#6E5C57"/>
    </linearGradient>
    <radialGradient id="shadowGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <style>
      /* 6s ループ: 0-28% アイドル / 30-55% ドラミング / 60-74% ジャンプ / 以降アイドル */
      #shadow   { animation: shadow 6s ease-in-out infinite; }
      #gorilla  { animation: bob 6s ease-in-out infinite; }
      #torso    { animation: breathe 6s ease-in-out infinite; transform-origin: 220px 250px; }
      #chest    { animation: thump 6s ease-in-out infinite; transform-origin: 220px 212px; }
      #armL     { animation: drumL 6s ease-in-out infinite; transform-origin: 176px 194px; }
      #armR     { animation: drumR 6s ease-in-out infinite; transform-origin: 264px 194px; }
      #impactL  { animation: hitL 6s infinite; }
      #impactR  { animation: hitR 6s infinite; }
      #head     { animation: nod 6s ease-in-out infinite; transform-origin: 220px 160px; }
      #eyelids  { animation: blink 6s infinite; transform-origin: 220px 116px; }

      @keyframes bob {
        0%, 28%   { transform: translateY(0); }
        14%       { transform: translateY(-3px); }
        /* ドラミング中は踏ん張るので沈む */
        34%, 52%  { transform: translateY(2px); }
        58%       { transform: translateY(0); }
        /* ジャンプ */
        63%       { transform: translateY(-30px); }
        68%       { transform: translateY(-34px); }
        74%       { transform: translateY(0); }
        78%       { transform: translateY(3px); }
        86%       { transform: translateY(-3px); }
        100%      { transform: translateY(0); }
      }

      @keyframes shadow {
        0%, 28%, 58%, 100% { transform: scale(1); opacity: 1; }
        63%, 68%           { transform: scale(0.7); opacity: 0.55; }
        74%                { transform: scale(1.06); opacity: 1; }
      }

      @keyframes breathe {
        0%, 100% { transform: scaleY(1); }
        14%      { transform: scaleY(1.035); }
        34%, 52% { transform: scaleY(1.05); }
        86%      { transform: scaleY(1.03); }
      }

      @keyframes thump {
        0%, 29%, 57%, 100% { transform: scale(1); }
        31%, 39%, 47%      { transform: scale(1.12); }
        35%, 43%, 51%      { transform: scale(0.97); }
      }

      /* 左腕: 負の角度で手が胸（右方向）へ寄る。胴を横切らない範囲に留める */
      @keyframes drumL {
        0%, 28%       { transform: rotate(0deg); }
        31%, 39%, 47% { transform: rotate(-16deg); }
        35%, 43%, 51% { transform: rotate(-4deg); }
        57%, 100%     { transform: rotate(0deg); }
        63%, 68%      { transform: rotate(-10deg); }
      }

      @keyframes drumR {
        0%, 28%       { transform: rotate(0deg); }
        31%, 39%, 47% { transform: rotate(4deg); }
        35%, 43%, 51% { transform: rotate(16deg); }
        57%, 100%     { transform: rotate(0deg); }
        63%, 68%      { transform: rotate(10deg); }
      }

      /* 衝撃線は腕が当たった瞬間だけ光らせる（左右で交互） */
      @keyframes hitL {
        0%, 30%, 33%, 38%, 41%, 46%, 49%, 100% { opacity: 0; }
        31%, 39%, 47%                          { opacity: 0.9; }
      }
      @keyframes hitR {
        0%, 34%, 37%, 42%, 45%, 50%, 53%, 100% { opacity: 0; }
        35%, 43%, 51%                          { opacity: 0.9; }
      }

      @keyframes nod {
        0%, 28%, 100% { transform: rotate(0deg); }
        14%           { transform: rotate(-1.6deg); }
        33%, 41%, 49% { transform: rotate(2.4deg); }
        37%, 45%, 53% { transform: rotate(-1deg); }
        63%, 68%      { transform: rotate(-3deg); }
      }

      @keyframes blink {
        0%, 20%, 24%, 66%, 70%, 100% { transform: scaleY(0); }
        21%, 23%, 67%, 69%           { transform: scaleY(1); }
      }

      @media (prefers-reduced-motion: reduce) {
        #shadow, #gorilla, #torso, #chest, #armL, #armR, #head, #eyelids { animation: none; }
      }
    </style>
  </defs>

  <ellipse id="shadow" cx="220" cy="312" rx="96" ry="15" fill="url(#shadowGrad)"/>

  <g id="gorilla">
    <!-- 脚 -->
    <g fill="url(#furGrad)">
      <path d="M176 246 q-16 24 -6 48 q4 10 16 10 h22 q10 0 10-10 v-48 z"/>
      <path d="M264 246 q16 24 6 48 q-4 10 -16 10 h-22 q-10 0 -10-10 v-48 z"/>
    </g>
    <!-- 足 -->
    <g fill="#5A4F4C">
      <ellipse cx="186" cy="300" rx="26" ry="11"/>
      <ellipse cx="254" cy="300" rx="26" ry="11"/>
    </g>

    <!-- 胴 -->
    <g id="torso">
      <path d="M220 148 q-62 0 -70 58 q-8 54 12 76 q16 18 58 18 q42 0 58-18 q20-22 12-76 q-8-58 -70-58 z"
            fill="url(#furGrad)"/>
      <ellipse id="chest" cx="220" cy="212" rx="40" ry="46" fill="url(#skinGrad)"/>
      <path d="M220 176 v66" stroke="#5F4E4A" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>
    </g>

    <!-- 腕: 肘を外に張り、拳を胸の高さに置いたドラミング姿勢。
         肩を支点に少し回すだけで叩いている動きが読み取れる -->
    <g id="armL">
      <path d="M176 194 L160 226 L198 216" fill="none" stroke="url(#armGrad)"
            stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="198" cy="216" r="14" fill="#8A7A75"/>
    </g>
    <g id="armR">
      <path d="M264 194 L280 226 L242 216" fill="none" stroke="url(#armGrad)"
            stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="242" cy="216" r="14" fill="#8A7A75"/>
    </g>

    <!-- ドラミングの衝撃線（拳のまわりに放射） -->
    <g id="impactL" stroke="#D8C8C2" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0">
      <path d="M186 200 l-8 -8"/>
      <path d="M181 212 l-12 -3"/>
      <path d="M186 228 l-8 8"/>
    </g>
    <g id="impactR" stroke="#D8C8C2" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0">
      <path d="M254 200 l8 -8"/>
      <path d="M259 212 l12 -3"/>
      <path d="M254 228 l8 8"/>
    </g>

    <!-- 頭 -->
    <g id="head">
      <!-- 耳 -->
      <circle cx="158" cy="150" r="13" fill="#463D40"/>
      <circle cx="282" cy="150" r="13" fill="#463D40"/>
      <!-- 頭部（矢状稜のドーム付き） -->
      <path d="M220 84 q-58 0 -60 52 q-2 46 60 46 q62 0 60-46 q-2-52 -60-52 z" fill="url(#furGrad)"/>
      <path d="M220 82 q-16 0 -18 14 q10-6 18-6 q8 0 18 6 q-2-14 -18-14 z" fill="#564C4F"/>
      <!-- 顔 -->
      <path d="M220 108 q-40 0 -42 30 q-2 32 42 32 q44 0 42-32 q-2-30 -42-30 z" fill="url(#skinGrad)"/>
      <!-- 眉庇 -->
      <path d="M182 112 q38-12 76 0 q-6 10 -38 10 q-32 0 -38-10 z" fill="#3E3639"/>
      <!-- 目 -->
      <g>
        <ellipse cx="202" cy="130" rx="8" ry="8.5" fill="#F3EFEA"/>
        <ellipse cx="238" cy="130" rx="8" ry="8.5" fill="#F3EFEA"/>
        <circle cx="203" cy="131" r="4.4" fill="#241E20"/>
        <circle cx="239" cy="131" r="4.4" fill="#241E20"/>
        <circle cx="204.6" cy="129" r="1.5" fill="#FFFFFF"/>
        <circle cx="240.6" cy="129" r="1.5" fill="#FFFFFF"/>
      </g>
      <!-- まぶた（blink で scaleY 0→1） -->
      <g id="eyelids" fill="url(#skinGrad)">
        <rect x="193" y="120" width="18" height="12" rx="5"/>
        <rect x="229" y="120" width="18" height="12" rx="5"/>
      </g>
      <!-- 鼻・口 -->
      <ellipse cx="220" cy="148" rx="15" ry="10" fill="#5B4A46"/>
      <ellipse cx="214" cy="147" rx="3" ry="4" fill="#302729"/>
      <ellipse cx="226" cy="147" rx="3" ry="4" fill="#302729"/>
      <path d="M206 162 q14 9 28 0" stroke="#4A3B38" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>
  </g>
</svg>
